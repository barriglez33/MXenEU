name: Update Mexicanos en Europa RSS

on:
  workflow_dispatch:

  schedule:
    # Ejecutar cada hora al minuto 23.
    - cron: "23 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Buscar, extraer y traducir noticias
        run: python main.py

      - name: Guardar RSS y noticias actualizadas
        run: |
          git config user.name "Mexicanos en Europa Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No hay noticias nuevas para guardar."
          else
            git commit -m "Actualizar noticias Mexicanos en Europa"
            git push
          fi
